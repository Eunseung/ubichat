<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UniChat 학생 로그인">
  <title>UniChat | 학생 로그인</title>
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <div class="page">
    <header class="wrap header public-header" data-public-header>
      <a class="brand" href="기업용_배너_포함.html" aria-label="UniChat 홈">
        <span class="brand-mark" aria-hidden="true"></span><span>UniChat</span>
      </a>
      <button class="mobile-nav-trigger" type="button" data-mobile-nav-trigger aria-label="주 메뉴 열기" aria-expanded="false">☰</button>
      <nav class="header-nav" aria-label="주 메뉴">
        <a href="university-explore.html">대학 탐색</a>
        <a data-student-nav="chats" href="login.html">상담하기</a>
      </nav>
      <div class="header-actions">
        <a class="university-service-link" data-university-service href="university-admin.html"><span aria-hidden="true">⌂</span> 대학 서비스</a>
        <a class="student-login-link" data-student-login href="login.html" aria-current="page">로그인</a>
        <div class="profile-menu" data-profile-menu hidden>
          <button class="profile-trigger" type="button" data-profile-trigger aria-haspopup="menu" aria-expanded="false">
            <span class="profile-avatar" data-profile-avatar>🇹🇭</span><span data-profile-name>NAPAT</span><span aria-hidden="true">⌄</span>
          </button>
          <div class="profile-dropdown" data-profile-dropdown role="menu" hidden>
            <div class="profile-summary"><strong data-profile-full-name>NAPAT SUKSAI</strong><span data-profile-email>napat@example.com</span></div>
            <a href="student-desktop.html?view=docs" role="menuitem">문서 보관함</a>
            <a href="student-desktop.html?view=my" role="menuitem">마이페이지</a>
            <button type="button" data-student-logout role="menuitem">로그아웃</button>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap student-login-main">
      <section class="student-login-intro" aria-labelledby="student-login-title">
        <p class="section-kicker">Student account</p>
        <h1 id="student-login-title">학생 로그인</h1>
        <p id="login-context">대학 탐색부터 상담, 문서 보관까지 학생 계정으로 이어서 이용하세요.</p>
      </section>

      <section class="student-login-card" aria-label="학생 로그인 양식">
        <form id="student-login-form">
          <label for="student-email">이메일</label>
          <input id="student-email" type="email" autocomplete="email" value="napat@example.com" required>
          <label for="student-password">비밀번호</label>
          <input id="student-password" type="password" autocomplete="current-password" value="password123" required>
          <div class="student-login-options"><label><input type="checkbox" checked> 로그인 유지</label><button type="button">비밀번호 찾기</button></div>
          <button class="button-primary student-login-submit" type="submit">학생 로그인 <span aria-hidden="true">→</span></button>
        </form>
        <div class="student-login-divider"><span>또는</span></div>
        <a class="button-secondary student-signup-link" href="student-desktop.html?view=signup">학생 회원가입</a>
        <div class="university-login-guide">
          <strong>대학 담당자이신가요?</strong>
          <p>대학 서비스에서 학생 상담과 공개 대학 정보를 관리할 수 있습니다.</p>
          <a href="university-admin.html">대학 서비스 로그인 <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>

    <footer class="footer"><div class="wrap footer-inner"><p>© 2026 UniChat</p><p><a href="university-explore.html">대학 탐색으로 돌아가기</a></p></div></footer>
  </div>
  <script src="university-data.js"></script>
  <script src="student-session.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    const requestedUniversity = query.get('universityId') || query.get('university');
    const university = window.UniversityDirectory?.resolve(requestedUniversity);
    const requestedReturn = query.get('returnTo');
    const fallback = university
      ? `student-desktop.html?universityId=${encodeURIComponent(university.id)}`
      : 'student-desktop.html?view=chats';

    function safeReturnTo(value) {
      const allowed = /^(student-(desktop|mobile)\.html|기업용_배너_(포함|미포함)\.html|university-(explore|detail)\.html)(?:[?#].*)?$/;
      return value && allowed.test(value) ? value : fallback;
    }

    const returnTo = safeReturnTo(requestedReturn);
    if (university) {
      document.querySelector('#login-context').textContent = `${university.name.ko} 상담을 시작하려면 학생 로그인이 필요합니다.`;
    }

    document.querySelector('#student-login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      window.UniChatStudentSession.signIn({ email: document.querySelector('#student-email').value.trim() || 'napat@example.com' });
      window.location.href = returnTo;
    });
  </script>
</body>
</html>
